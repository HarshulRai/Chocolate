<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Candy Shop</h1>
    <p>Add candies to the stock and sell them one, two or three at a time.</p>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2>Add a candy</h2>
      <form id="candy-form">
        <div class="field">
          <label for="name">Candy name</label>
          <input type="text" id="name" name="name" placeholder="Eclair" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" placeholder="Chocolaty" required />
        </div>
        <div class="field">
          <label for="price">Price (₹)</label>
          <input type="number" id="price" name="price" min="0" step="0.01" placeholder="2" required />
        </div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" name="quantity" min="1" step="1" placeholder="100" required />
        </div>
        <button type="submit" class="btn-add">Add Item</button>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="card list-card">
      <div class="list-head">
        <h2>Stock</h2>
        <span id="count" class="count">0 items</span>
      </div>
      <div class="table-head">
        <span>Candy</span>
        <span>Description</span>
        <span>Price</span>
        <span>In stock</span>
        <span>Buy</span>
      </div>
      <ul id="candy-list" class="candy-list"></ul>
      <p id="empty" class="empty">No candies yet. Add your first one above.</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
